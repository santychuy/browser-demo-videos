name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Bun 1.4.4 / Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - name: Install maintainer tools without lifecycle scripts
        run: bun --no-env-file install --frozen-lockfile --ignore-scripts
      - name: Check JavaScript syntax
        run: bun --no-env-file run check
      - name: Run offline unit tests
        run: bun --no-env-file test
      - name: Check formatting
        run: bun --no-env-file run format:check
      - name: Inspect source package payload without publishing
        run: bun --no-env-file pm pack --dry-run --ignore-scripts
      - name: Package self-contained skill with Python 3
        run: bun --no-env-file run package:skill
