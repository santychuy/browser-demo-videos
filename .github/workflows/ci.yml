name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install maintainer tools without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run offline unit tests
        run: npm test
      - name: Check formatting
        run: npm run format:check
      - name: Inspect npm source payload without publishing
        run: npm pack --dry-run
      - name: Package self-contained skill with Python 3
        run: npm run package:skill
