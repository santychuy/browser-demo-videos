<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>{{TITLE}}</title>
    <style>
      :root {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #20263b;
        background: #f5f6fa;
        font-synthesis: none;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid #7c6ef6;
        outline-offset: 4px;
      }
      .app-header {
        height: 56px;
        padding: 0 40px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        border-bottom: 1px solid #e8eaf1;
      }
      .header-left,
      .brand,
      .header-right,
      .nav {
        display: flex;
        align-items: center;
      }
      .header-left {
        gap: 42px;
      }
      .brand {
        gap: 10px;
        font-size: 17px;
        font-weight: 750;
        letter-spacing: -0.4px;
      }
      .brand-mark {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #6353d8;
        color: white;
        font-size: 19px;
      }
      .nav {
        gap: 26px;
        height: 56px;
        color: #73788b;
        font-size: 13px;
      }
      .nav-current {
        height: 56px;
        display: flex;
        align-items: center;
        border-bottom: 2px solid #6353d8;
        color: #5142ba;
        font-weight: 650;
      }
      .header-right {
        gap: 13px;
        color: #697086;
        font-size: 12px;
      }
      .team-avatar {
        display: grid;
        place-items: center;
        width: 29px;
        height: 29px;
        border-radius: 50%;
        background: #f0edff;
        color: #6754bb;
        font-weight: 700;
      }
      main {
        width: min(1168px, calc(100% - 64px));
        margin: 16px auto 0;
      }
      .page-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        margin-bottom: 14px;
      }
      .eyebrow {
        margin: 0 0 4px;
        font-size: 10px;
        line-height: 14px;
        letter-spacing: 1.4px;
        font-weight: 750;
        color: #7b8195;
      }
      h1 {
        margin: 0;
        font-size: 29px;
        line-height: 34px;
        font-weight: 700;
        letter-spacing: -0.9px;
      }
      .subheading {
        margin: 4px 0 0;
        font-size: 13px;
        line-height: 18px;
        color: #747b90;
      }
      .workspace-label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
        color: #6e7587;
        background: white;
        border: 1px solid #e5e7ef;
        border-radius: 20px;
        padding: 9px 13px;
        white-space: nowrap;
      }
      .live-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #65a58c;
      }
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-bottom: 16px;
      }
      .metric {
        position: relative;
        min-height: 78px;
        padding: 13px 18px;
        border: 1px solid #e5e8f0;
        background: white;
        border-radius: 11px;
        overflow: hidden;
        box-shadow: 0 2px 3px #24284602;
      }
      .metric-label {
        font-size: 11px;
        color: #70788c;
      }
      .metric strong {
        display: flex;
        align-items: baseline;
        gap: 11px;
        font-size: 25px;
        line-height: 32px;
        letter-spacing: -0.7px;
        font-weight: 650;
      }
      .metric-note {
        font-size: 11px;
        font-weight: 400;
        letter-spacing: 0;
        color: #9095a5;
      }
      .metric-line {
        position: absolute;
        width: 4px;
        height: 31px;
        right: 19px;
        top: 24px;
        border-radius: 4px;
      }
      .purple-line {
        background: #c5bcfa;
      }
      .orange-line {
        background: #edc397;
      }
      .green-line {
        background: #a2ccbc;
      }
      .panel {
        overflow: hidden;
        background: white;
        border: 1px solid #e4e7f0;
        border-radius: 12px;
        box-shadow: 0 3px 12px #202c4a03;
      }
      .panel-toolbar {
        min-height: 66px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 18px;
        gap: 16px;
      }
      h2 {
        margin: 0;
        font-size: 14px;
        font-weight: 650;
        letter-spacing: -0.15px;
      }
      .panel-toolbar p {
        margin: 5px 0 0;
        font-size: 11px;
        color: #8b90a1;
      }
      .count-badge {
        display: inline-grid;
        place-items: center;
        min-width: 21px;
        height: 19px;
        padding: 0 5px;
        margin-left: 5px;
        border-radius: 5px;
        font-size: 10px;
        font-weight: 600;
        background: #f1f0f8;
        color: #70638f;
        vertical-align: 1px;
      }
      .toolbar-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #attention-filter,
      .primary-button,
      .secondary-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        height: 40px;
        padding: 0 14px;
        border-radius: 7px;
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }
      #attention-filter {
        min-width: 190px;
        border: 1px solid #e0e3ec;
        background: white;
        color: #5f667c;
      }
      #attention-filter:hover {
        background: #f9f8ff;
        border-color: #bfb5ed;
      }
      #attention-filter[aria-pressed="true"] {
        background: #f1edff;
        border-color: #b5a8ed;
        color: #6550bf;
      }
      .filter-icon {
        font-size: 20px;
        line-height: 1;
        transform: rotate(180deg);
      }
      .button-count {
        display: grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        border-radius: 4px;
        background: #f0f0f6;
        font-size: 10px;
      }
      #attention-filter[aria-pressed="true"] .button-count {
        background: #ded6fb;
      }
      .primary-button {
        min-width: 131px;
        border: 1px solid #6251cb;
        background: #6856d8;
        color: white;
        box-shadow: 0 2px 3px #5c48b818;
      }
      .primary-button:hover {
        background: #5744c0;
      }
      .secondary-button {
        background: white;
        border: 1px solid #e0e3ec;
        color: #626a80;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
        white-space: nowrap;
        font-size: 12px;
      }
      th {
        height: 31px;
        padding: 0 18px;
        color: #8a91a3;
        background: #fafbfe;
        border-top: 1px solid #eef0f6;
        border-bottom: 1px solid #eef0f6;
        font-size: 10px;
        font-weight: 600;
      }
      td {
        height: 37px;
        padding: 0 18px;
        color: #788095;
        border-bottom: 1px solid #f0f1f6;
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tr[hidden] {
        display: none;
      }
      .project-name {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 550;
        color: #434c64;
      }
      .project-icon {
        display: inline-grid;
        place-items: center;
        width: 27px;
        height: 26px;
        border-radius: 6px;
        font-size: 8px;
        font-weight: 750;
        letter-spacing: -0.3px;
      }
      .purple {
        color: #8572b8;
        background: #f0eafa;
      }
      .blue {
        color: #6a89bb;
        background: #eaf1fc;
      }
      .orange {
        color: #b88b59;
        background: #fbf0e4;
      }
      .green {
        color: #6d9d87;
        background: #eaf4ef;
      }
      .pink {
        color: #b482a4;
        background: #f8ebf4;
      }
      .owner {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 11px;
      }
      .avatar {
        display: inline-grid;
        place-items: center;
        height: 22px;
        width: 22px;
        border-radius: 50%;
        font-size: 8px;
        background: #f0f1f6;
        color: #8890a1;
      }
      .status {
        display: inline-block;
        padding: 4px 7px;
        border-radius: 5px;
        font-size: 10px;
      }
      .status span {
        font-size: 7px;
        vertical-align: 1px;
        margin-right: 3px;
      }
      .attention {
        color: #b18754;
        background: #fcf4e9;
      }
      .on-track {
        color: #67937d;
        background: #edf6f0;
      }
      .numeric {
        text-align: right;
      }
      .panel-footer {
        min-height: 28px;
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 0 18px;
        border-top: 1px solid #eef0f6;
        font-size: 10px;
        color: #9298aa;
      }
      .site-footer {
        padding: 11px 0;
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: #a0a6b5;
      }
      .export-banner {
        display: flex;
        align-items: center;
        gap: 17px;
        padding: 20px 23px;
        margin-bottom: 16px;
        background: #eff6f2;
        border: 1px solid #d6e7dd;
        border-radius: 12px;
      }
      .success-mark {
        display: grid;
        place-items: center;
        width: 43px;
        height: 43px;
        border-radius: 50%;
        color: #52856a;
        background: #dcece2;
        font-size: 21px;
      }
      .export-banner .eyebrow {
        color: #6a957e;
      }
      .export-banner h2 {
        font-size: 20px;
        color: #355b47;
      }
      .export-banner p:last-child {
        margin: 7px 0 0;
        color: #779082;
        font-size: 11px;
      }
      .export-tag {
        margin-left: auto;
        color: #7c9b89;
        font-size: 9px;
        letter-spacing: 1px;
      }
      .view-label {
        font-size: 11px;
        color: #9c7c52;
        border: 1px solid #eadfcf;
        background: #fcf8f1;
        padding: 7px 10px;
        border-radius: 6px;
      }
      @media (max-width: 800px) {
        .app-header {
          padding: 0 20px;
        }
        .nav {
          display: none;
        }
        main {
          width: calc(100% - 32px);
        }
        .page-heading {
          align-items: flex-start;
        }
        .workspace-label,
        .export-tag {
          display: none;
        }
        .metric-grid {
          gap: 8px;
        }
        .metric {
          padding: 11px;
        }
        .metric strong {
          flex-wrap: wrap;
          gap: 0;
        }
        .metric-note {
          width: 100%;
          line-height: 14px;
        }
        .metric-line {
          display: none;
        }
        .panel-toolbar {
          align-items: flex-start;
          flex-direction: column;
        }
        .panel-footer {
          padding: 8px 14px;
        }
        .panel-footer span:last-child {
          display: none;
        }
        h1 {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="header-left">
        <a class="brand" href="/" aria-label="Northstar workspace home"
          ><span class="brand-mark" aria-hidden="true">✳</span> northstar</a
        >
        <nav class="nav" aria-label="Workspace">
          <a class="nav-current" href="/" aria-current="page">Projects</a
          ><span>Team workspace</span>
        </nav>
      </div>
      <div class="header-right">
        <span>Acme Studio</span
        ><span class="team-avatar" aria-label="Demo user: Alex Taylor">AT</span>
      </div>
    </header>
    <main>
      {{CONTENT}}
      <footer class="site-footer">
        <span>Less noise. More forward motion.</span
        ><span>Northstar · A local, synthetic demo workspace</span>
      </footer>
    </main>
    <script>
      const filter = document.querySelector("#attention-filter");
      if (filter) {
        filter.addEventListener("click", () => {
          const attentionOnly = filter.getAttribute("aria-pressed") !== "true";
          filter.setAttribute("aria-pressed", String(attentionOnly));
          const rows = [...document.querySelectorAll("#project-rows tr")];
          let count = 0;
          for (const row of rows) {
            row.hidden = attentionOnly && row.dataset.attention !== "true";
            if (!row.hidden) count += 1;
          }
          const view = attentionOnly ? "attention" : "all";
          document.querySelector("#projects").dataset.view = view;
          const badge = document.querySelector("#project-count");
          badge.textContent = String(count);
          badge.dataset.count = String(count);
          document.querySelector("#filter-description").textContent =
            attentionOnly
              ? "Only projects that need a decision or a helping hand."
              : "All active projects, in one place.";
          document.querySelector("#visible-projects").textContent =
            `Showing ${count} of ${rows.length} projects`;
          document.querySelector("#export-projects").href =
            `/export?view=${view}`;
        });
      }
    </script>
  </body>
</html>
